name: Deploy PUDE 2026 slides to GitHub Pages

on:
  push:
    branches:
      # TODO: switch to `main` once this branch is merged
      - doublegyre-pude26
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: doublegyre/pude-2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: doublegyre/pude-2026/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build slides
        # Base path and router mode are set here so local dev/build need no changes.
        run: pnpm exec slidev build --base /${{ github.event.repository.name }}/ --router-mode hash

      - name: Create materials redirect
        run: |
          mkdir -p dist/materials
          cat > dist/materials/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=https://github.com/${{ github.repository }}/releases/tag/pude-2026-materials-latest">
              <title>Redirecting to materials...</title>
            </head>
            <body>
              <p>Redirecting to <a href="https://github.com/${{ github.repository }}/releases/tag/pude-2026-materials-latest">hands-on materials</a>...</p>
            </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doublegyre/pude-2026/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
